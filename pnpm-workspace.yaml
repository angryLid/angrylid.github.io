allowBuilds:
  esbuild: true
  sharp: true
# The repo lives in a shared workspace synced between two machines; the
# before-run deps check sees the other side's lockfile/package.json churn as
# "dirty" and keeps demanding a full purge-reinstall on every pnpm run.
# Install manually after dependency changes instead.
verifyDepsBeforeRun: false
# Cap parallel tarball downloads (pnpm 11.6+ defaults to min(96, cores*3), which
# hammers the registry); maxSockets per origin is derived as 3x this value.
networkConcurrency: 8
# Only fetch native-binary optionalDependencies (sharp libvips, rolldown
# bindings) for the platforms we actually use: macOS Apple Silicon and
# linux-gnu. musl/Alpine, win32, android, freebsd, s390x/ppc64/riscv64 are
# skipped. The current platform is always included implicitly.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
  libc:
    - glibc
nodeLinker: hoisted
overrides:
  style-to-js: 2.0.1
