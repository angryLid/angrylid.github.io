    <line x1="169" y1="169" x2="175" y2="169" stroke="#dc2626" stroke-width="2"/>
    <text x="183" y="138" text-anchor="start" font-size="10" font-weight="800" fill="#dc2626">被抽走</text>
    <text x="183" y="152" text-anchor="start" font-size="11" font-weight="900" fill="#dc2626">2.6 元</text>

    <text x="110" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#6b7280">含税套餐无法涨价</text>
