    <circle cx="312" cy="160" r="68" fill="url(#lensGrad)" stroke="#4b5563" stroke-width="6"/>
    <circle cx="312" cy="160" r="68" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
    <line x1="361" y1="209" x2="385" y2="233" stroke="#4b5563" stroke-width="9" stroke-linecap="round"/>
