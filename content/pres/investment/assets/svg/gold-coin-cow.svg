<svg viewBox="38 138 412 165" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gcCoin" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#fef3a8" />
      <stop offset="55%" stop-color="#f0c14b" />
      <stop offset="100%" stop-color="#d08a08" />
    </radialGradient>
    <linearGradient id="gcCow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c26212" />
      <stop offset="100%" stop-color="#9a4a0a" />
    </linearGradient>
    <clipPath id="gcBody">
      <ellipse cx="398" cy="188" rx="76" ry="42" />
    </clipPath>
  </defs>

  <!-- ground: the long river of time -->
  <line x1="50" y1="272" x2="448" y2="272" stroke="#ddd5c0" stroke-width="2" />
  <circle cx="90" cy="272" r="3.5" fill="#cfc5ab" />
  <circle cx="240" cy="272" r="3.5" fill="#cfc5ab" />
  <circle cx="390" cy="272" r="3.5" fill="#cfc5ab" />
  <text x="90" y="293" font-size="13" font-weight="600" fill="#b3a98f" text-anchor="middle" font-family="'Noto Serif SC','Songti SC','WenQuanYi Zen Hei',serif">古罗马</text>
  <text x="240" y="293" font-size="13" font-weight="600" fill="#b3a98f" text-anchor="middle" font-family="'Noto Serif SC','Songti SC','WenQuanYi Zen Hei',serif">中世纪</text>
  <text x="390" y="293" font-size="13" font-weight="600" fill="#b3a98f" text-anchor="middle" font-family="'Noto Serif SC','Songti SC','WenQuanYi Zen Hei',serif">今天</text>

  <!-- one gold coin -->
  <ellipse cx="104" cy="272" rx="60" ry="6" fill="#000" opacity="0.10" />
  <ellipse cx="110" cy="212" rx="62" ry="58" fill="#a9710a" />
  <ellipse cx="104" cy="207" rx="62" ry="58" fill="url(#gcCoin)" stroke="#a9710a" stroke-width="2.5" />
  <ellipse cx="104" cy="207" rx="51" ry="47" fill="none" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.75" />
  <text x="104" y="199" font-size="17" font-weight="700" fill="#8a5a12" text-anchor="middle" letter-spacing="1" font-family="'Times New Roman',serif">1 oz</text>
  <text x="104" y="234" font-size="30" font-weight="700" fill="#8a5a12" text-anchor="middle" font-family="'Times New Roman',serif">Au</text>

  <!-- the exchange -->
  <g stroke="#b99a5e" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M178 192 H212" />
    <path d="M220 212 H184" />
  </g>
  <path d="M224 192 l-14 -7 v14 z" fill="#b99a5e" />
  <path d="M174 212 l14 -7 v14 z" fill="#b99a5e" />

  <!-- one cow: shifted left to sit close to the coin, which tightens the crop -->
  <g transform="translate(-52 0)">
  <!-- neck: a thick stroke whose ends are hidden under the body and the head -->
  <path d="M328 168 L368 186" stroke="#b0520e" stroke-width="42" stroke-linecap="round" fill="none" />

  <!-- far-side legs first, then the near-side pair, so the animal reads with depth -->
  <g stroke="#7c2d12" stroke-width="2">
    <rect x="356" y="198" width="16" height="72" rx="7" fill="#8f4509" />
    <rect x="442" y="200" width="16" height="70" rx="7" fill="#8f4509" />
    <rect x="330" y="194" width="17" height="76" rx="7.5" fill="#b4600f" />
    <rect x="414" y="196" width="17" height="74" rx="7.5" fill="#b4600f" />
  </g>
  <g fill="#5b2108">
    <rect x="355" y="262" width="18" height="10" rx="3" />
    <rect x="441" y="262" width="18" height="10" rx="3" />
    <rect x="329" y="262" width="19" height="10" rx="3" />
    <rect x="413" y="262" width="19" height="10" rx="3" />
  </g>

  <!-- body -->
  <ellipse cx="398" cy="188" rx="78" ry="44" fill="url(#gcCow)" stroke="#7c2d12" stroke-width="2.5" />

  <!-- tail -->
  <path d="M470 170 C486 188 490 218 482 246" stroke="#7c2d12" stroke-width="4" stroke-linecap="round" fill="none" />
  <ellipse cx="481" cy="252" rx="6" ry="9" fill="#7c3a1e" />

  <!-- udder -->
  <ellipse cx="408" cy="236" rx="20" ry="13" fill="#f2e4c9" stroke="#a8560f" stroke-width="2" />
  <path d="M400 245 v6 M416 245 v6" stroke="#a8560f" stroke-width="3.4" stroke-linecap="round" />

  <!-- patches, clipped to the body silhouette -->
  <g clip-path="url(#gcBody)" fill="#f2e4c9" opacity="0.94">
    <ellipse cx="432" cy="162" rx="31" ry="23" transform="rotate(-14 432 162)" />
    <ellipse cx="352" cy="202" rx="21" ry="14" transform="rotate(10 352 202)" />
    <ellipse cx="374" cy="154" rx="12" ry="8" transform="rotate(-8 374 154)" />
  </g>

  <!-- head -->
  <ellipse cx="320" cy="176" rx="28" ry="25" fill="url(#gcCow)" stroke="#7c2d12" stroke-width="2.5" />
  <!-- ears (no horns: horn stubs read as antennae at this scale) -->
  <ellipse cx="298" cy="158" rx="13" ry="8" fill="#8f4509" stroke="#7c2d12" stroke-width="1.8" transform="rotate(24 298 158)" />
  <ellipse cx="347" cy="166" rx="14" ry="8.5" fill="#a8560f" stroke="#7c2d12" stroke-width="1.8" transform="rotate(-30 347 166)" />
  <!-- muzzle + nostrils -->
  <ellipse cx="302" cy="192" rx="16" ry="13" fill="#f2e4c9" stroke="#7c2d12" stroke-width="1.8" />
  <circle cx="297" cy="189" r="2.2" fill="#7c3a1e" />
  <circle cx="306" cy="194" r="2.2" fill="#7c3a1e" />
  <!-- eyes: both visible, so the head reads as a face turned towards the coin -->
  <circle cx="308" cy="170" r="3.2" fill="#1f2937" />
  <circle cx="306.9" cy="168.9" r="1" fill="#fff" opacity="0.85" />
  <circle cx="327" cy="168" r="3.4" fill="#1f2937" />
  <circle cx="325.9" cy="166.9" r="1.1" fill="#fff" opacity="0.85" />
  </g>
</svg>
