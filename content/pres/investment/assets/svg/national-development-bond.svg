  </defs>

  <rect x="40" y="25" width="320" height="175" rx="8" fill="url(#bondGrad)" stroke="#e2e2e2" stroke-width="1.5"/>
  <rect x="40" y="25" width="320" height="32" rx="8" fill="#374151"/>
  <rect x="40" y="45" width="320" height="12" fill="#374151"/>

