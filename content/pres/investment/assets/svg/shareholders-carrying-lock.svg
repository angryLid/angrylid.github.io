<svg xmlns="http://www.w3.org/2000/svg" viewBox="255 105 450 290" role="img" aria-label="Retail investors carrying a ship lock on their shoulders">
  <defs>
    <!-- One chibi retail investor: feet at (0,0), head r=30, trapezoid upper body, no legs -->
    <g id="shareholder">
      <!-- trapezoid upper body: narrow at the shoulders, wide at the base -->
      <path d="M-15 -83 L15 -83 L27 0 L-27 0 Z" fill="#1f4e79" stroke="#1f4e79" stroke-width="6" stroke-linejoin="round" />
      <!-- arms raised to head-top level -->
      <path d="M-14 -75 L-26 -133" stroke="#1f4e79" stroke-width="10" stroke-linecap="round" fill="none" />
      <path d="M14 -75 L26 -133" stroke="#1f4e79" stroke-width="10" stroke-linecap="round" fill="none" />
      <!-- big head -->
      <circle cx="0" cy="-113" r="30" fill="#f3c9a2" />
      <!-- ears -->
      <circle cx="-30" cy="-113" r="5" fill="#f3c9a2" />
      <circle cx="30" cy="-113" r="5" fill="#f3c9a2" />
      <!-- prominent headband with knot tails -->
      <rect x="-30" y="-132" width="60" height="18" rx="9" fill="#7fb3d8" stroke="#4a8ac0" stroke-width="1.5" />
      <path d="M-28 -127 l-14 -3 l5 11 z" fill="#7fb3d8" />
      <path d="M-27 -123 l-13 3 l9 6 z" fill="#5e9ec9" />
      <text x="0" y="-122" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="central">股民</text>
      <!-- straining face -->
      <path d="M-12 -105 l7 3 M12 -105 l-7 3" stroke="#16375a" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M-5 -91 q5 3 10 0" stroke="#16375a" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- hands gripping the beam at head-top level -->
      <circle cx="-27" cy="-137" r="6" fill="#f3c9a2" />
      <circle cx="27" cy="-137" r="6" fill="#f3c9a2" />
    </g>
    <!-- sweat drop -->
    <path id="sweat" d="M0 0 c4 5 4 9 0 12 c-4 -3 -4 -7 0 -12 z" fill="#6aa9d8" />
  </defs>

  <!-- ============ ship lock (sits on the beam top at y=237, above the heads) ============ -->
  <g transform="translate(0 9)">
    <!-- chamber trough -->
    <rect x="292" y="150" width="376" height="78" rx="4" fill="#cfd6dd" stroke="#7d8894" stroke-width="2" />
    <!-- cutaway water -->
    <path d="M310 182 q12 -6 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 v46 h-336 z" fill="#7fb3d8" />
    <!-- bulk carrier: raked bow, hatch covers, stern bridge, funnel, mast (raised: slight draught) -->
    <g transform="translate(0 -24)">
      <!-- mast -->
      <path d="M370 176 V158" stroke="#3a4f66" stroke-width="2.5" />
      <circle cx="370" cy="156" r="3" fill="#3a4f66" />
      <!-- funnel -->
      <rect x="566" y="136" width="18" height="4" rx="1.5" fill="#7d8894" />
      <rect x="568" y="140" width="14" height="14" rx="2" fill="#c0392b" />
      <!-- stern superstructure / bridge -->
      <rect x="556" y="152" width="42" height="24" rx="2" fill="#cfd6dd" stroke="#7d8894" stroke-width="1.5" />
      <rect x="560" y="157" width="34" height="6" rx="1.5" fill="#4f6a8d" />
      <path d="M560 169 h34 M560 172 h34" stroke="#aeb9c4" stroke-width="1.5" />
      <!-- hatch covers -->
      <rect x="398" y="169" width="46" height="7" rx="1.5" fill="#8fa3b5" />
      <rect x="452" y="169" width="46" height="7" rx="1.5" fill="#8fa3b5" />
      <rect x="506" y="169" width="42" height="7" rx="1.5" fill="#8fa3b5" />
      <!-- hull with raked bow (pointing left) -->
      <path d="M360 176 Q372 208 384 214 L600 214 L600 176 Z" fill="#4f6a8d" />
      <!-- anti-fouling red bottom + boot stripe -->
      <path d="M384 214 L600 214 L600 208 L390 208 Z" fill="#8c4a2f" />
      <path d="M390 208 L600 208" stroke="#e8eef4" stroke-width="2" />
      <!-- anchor and hawse hole -->
      <circle cx="382" cy="192" r="3" fill="#2f4257" />
    </g>
    <!-- bow wake (stays on the waterline) -->
    <path d="M352 184 q-9 4 -16 3 M350 192 q11 2 18 -1" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
    <!-- translucent water strip in front of the hull -->
    <rect x="354" y="182" width="252" height="10" fill="#7fb3d8" opacity="0.55" />
    <!-- miter gate hints (chevrons pointing inward) -->
    <path d="M334 196 l14 13 l-14 13" stroke="#7d8894" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M626 196 l-14 13 l14 13" stroke="#7d8894" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <!-- gate towers -->
    <rect x="292" y="138" width="46" height="90" rx="3" fill="#aab4bf" stroke="#7d8894" stroke-width="2" />
    <rect x="622" y="138" width="46" height="90" rx="3" fill="#aab4bf" stroke="#7d8894" stroke-width="2" />
    <!-- tower control houses -->
    <rect x="300" y="122" width="30" height="18" rx="3" fill="#7d8894" />
    <rect x="630" y="122" width="30" height="18" rx="3" fill="#7d8894" />
    <rect x="309" y="115" width="4" height="9" fill="#7d8894" />
    <rect x="647" y="115" width="4" height="9" fill="#7d8894" />
    <circle cx="311" cy="112" r="3" fill="#c0392b" />
    <circle cx="649" cy="112" r="3" fill="#c0392b" />
    <!-- top walkway rails -->
    <path d="M296 138 v-8 h38 v8 M626 138 v-8 h38 v8" stroke="#7d8894" stroke-width="2.5" fill="none" />
    <!-- concrete seams -->
    <path d="M292 226 h376" stroke="#7d8894" stroke-width="2" />
  </g>

  <!-- carrying beam at head-top level (drawn before figures so heads sit in front) -->
  <rect x="270" y="237" width="420" height="11" rx="5.5" fill="#2c6ca8" />
  <rect x="270" y="237" width="420" height="4" rx="2" fill="#4a8ac0" />

  <!-- ============ three shareholders, standing area as wide as the lock ============ -->
  <use href="#shareholder" x="365" y="380" />
  <use href="#shareholder" x="480" y="380" />
  <use href="#shareholder" x="595" y="380" />

  <!-- sweat drops showing strain -->
  <use href="#sweat" x="398" y="219" />
  <use href="#sweat" x="513" y="213" />
  <use href="#sweat" x="628" y="219" />

  <!-- ground -->
  <path d="M330 382 h300" stroke="#cbd5e0" stroke-width="3" stroke-linecap="round" />
</svg>
